<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NWS forecast · Snoqualmie Pass</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <script src="nws.js"></script>
  <style>
    /* Alerts and the snow strip hug their content; the 6 periods share the rest. */
    #forecast { --cols: 3; --cols-portrait: 2; --embed-min-col: 240px; grid-template-rows: auto; }
    #forecast.with-alerts { grid-template-rows: auto auto; }
    html.embed #forecast { grid-template-rows: none; }

    .alerts, .snow-strip { grid-column: 1 / -1; }

    .alerts { display: grid; gap: 0.4rem; }
    .alert { padding: 0.5em 0.8em; border-radius: 0.5rem; border-left: 0.4em solid; font-size: 0.9rem; }
    .alert .event { font-size: 1.15em; font-weight: bold; }
    .alert .when { font-size: 0.8em; opacity: 0.85; }
    .alert.severe   { background: var(--color-status-danger-bg);  color: var(--color-status-danger);  border-color: var(--color-status-danger); }
    .alert.moderate { background: var(--color-status-warning-bg); color: var(--color-status-warning); border-color: var(--color-safety-caution); }
    .alert.minor    { background: var(--color-surface-subtle);    color: var(--color-text-primary);   border-color: var(--color-border-strong); }

    .snow-strip {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 0.3rem 1.5rem;
      padding: 0.4em 0.8em;
      border-radius: 0.5rem;
      background: var(--color-surface-subtle);
      font-size: 0.9rem;
    }
    .snow-strip b { font-size: 1.3em; }
    .snow-strip .sub { font-size: 0.85em; color: var(--color-text-secondary); }

    .period {
      display: flex;
      flex-direction: column;
      gap: 0.3em;
      min-width: 0;
      padding: 0.6em 0.8em;
      border-radius: 0.5rem;
      background: var(--color-surface-selected);
      font-size: 0.9rem;
    }
    .period.night { background: var(--color-surface-subtle); }
    .period .top { display: flex; align-items: center; gap: 0.6em; }
    .period img { width: 3em; height: 3em; border-radius: 0.4rem; flex: none; }
    .period h3 { margin: 0; font-size: 1.1em; color: var(--color-text-brand); }
    .period .temp { margin-left: auto; font-size: 1.9em; font-weight: 700; color: var(--color-text-brand); line-height: 1; }
    .period .detail { margin: 0; line-height: 1.3; }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>NWS forecast · Snoqualmie Pass</h1>
    <div class="page-status"></div>
  </header>

  <div id="forecast" class="panel">Loading forecast...</div>

  <footer class="page-foot">
    <span>National Weather Service, Seattle</span>
    <span class="updated"></span>
  </footer>

  <script>
    const PERIODS = 6; // day / night halves shown

    async function fetchForecast() {
      const [forecast, grid, alerts] = await Promise.all([
        fetchJson(`${NWS_GRID}/forecast`),
        fetchJson(NWS_GRID),
        // Alerts are optional: the forecast still shows if that call fails.
        fetchJson(`https://api.weather.gov/alerts/active?point=${NWS_POINT.lat},${NWS_POINT.lon}`)
          .catch((err) => { console.error("NWS alerts:", err); return null; }),
      ]);
      return { forecast, grid, alerts };
    }

    // ===== Alerts (watches, warnings, advisories) =====

    const severityClass = (s) =>
      /extreme|severe/i.test(s) ? "severe" : /moderate/i.test(s) ? "moderate" : "minor";

    function renderAlerts(alerts) {
      const list = toArray(alerts?.features).map((f) => f.properties);
      if (!list.length) return "";
      return `<div class="alerts">${list.map((a) => {
        const until = formatTime(a.ends ?? a.expires);
        return `<div class="alert ${severityClass(a.severity)}">
          <div class="event">${escapeHtml(a.event)}</div>
          <div>${escapeHtml(a.headline ?? "")}</div>
          ${until ? `<div class="when">Until ${escapeHtml(until)}</div>` : ""}
        </div>`;
      }).join("")}</div>`;
    }

    // ===== New snow and snow level, from the NWS grid forecast =====

    // Grid values are [{ validTime: "2026-09-28T00:00:00+00:00/PT6H", value }].
    function valuesWithin(series, hours) {
      const now = Date.now(), until = now + hours * 3600e3;
      return toArray(series?.values).filter((v) => {
        const start = Date.parse(v.validTime.split("/")[0]);
        return start < until && start >= now - 6 * 3600e3 && v.value != null;
      });
    }

    function snowTotal(grid, hours) {
      const inches = valuesWithin(grid?.properties?.snowfallAmount, hours)
        .reduce((sum, v) => sum + v.value, 0) / 25.4;
      return inches < 0.5 ? (inches > 0 ? "Trace" : "0\"") : `${Math.round(inches)}"`;
    }

    function snowLevelRange(grid, hours) {
      const ft = valuesWithin(grid?.properties?.snowLevel, hours)
        .map((v) => Math.round((v.value * 3.28084) / 100) * 100);
      if (!ft.length) return "";
      const lo = Math.min(...ft), hi = Math.max(...ft);
      return lo === hi ? `${lo.toLocaleString()} ft` : `${lo.toLocaleString()}–${hi.toLocaleString()} ft`;
    }

    function renderSnowStrip(grid) {
      const level = snowLevelRange(grid, 24);
      return `<div class="snow-strip">
        <span>New snow next 24h <b>${snowTotal(grid, 24)}</b></span>
        <span>Next 48h <b>${snowTotal(grid, 48)}</b></span>
        ${level ? `<span>Snow level next 24h <b>${escapeHtml(level)}</b> <span class="sub">(pass 3,022 ft)</span></span>` : ""}
      </div>`;
    }

    // ===== Periods, with NWS's full detailed description =====

    function renderPeriod(p) {
      const icon = p.icon ? `<img src="${escapeHtml(p.icon.replace(/size=\w+/, "size=large"))}" alt="">` : "";
      return `<div class="period${p.isDaytime ? "" : " night"}">
        <div class="top">
          ${icon}
          <h3>${escapeHtml(p.name)}</h3>
          <span class="temp">${escapeHtml(p.temperature)}°</span>
        </div>
        <p class="detail">${escapeHtml(p.detailedForecast || p.shortForecast)}</p>
      </div>`;
    }

    startPage("forecast", (el, { forecast, grid, alerts }) => {
      const periods = toArray(forecast?.properties?.periods).slice(0, PERIODS);
      if (!periods.length) return showMessage(el, "Forecast unavailable.");

      const alertsHtml = renderAlerts(alerts);
      el.classList.toggle("with-alerts", Boolean(alertsHtml));
      el.innerHTML = alertsHtml + renderSnowStrip(grid) + periods.map(renderPeriod).join("");
      return "";
    }, ({ forecast }) => forecast?.properties?.updateTime ?? forecast?.properties?.generatedAt, fetchForecast);
  </script>
</body>
</html>
