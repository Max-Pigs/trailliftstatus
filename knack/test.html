<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Embed test</title>
<style>body{font-family:Arial,sans-serif;margin:20px;background:#fafafa}iframe{width:100%;border:0;display:block;height:150px}</style>
<script>
// Local copy of knack/custom.js, with the origin check relaxed for localhost.
window.addEventListener("message", function (event) {
  var data = event.data;
  if (!data || data.source !== "trailliftstatus") return;
  document.querySelectorAll("iframe").forEach(function (frame) {
    if (frame.contentWindow === event.source) frame.style.height = data.height + "px";
  });
});
</script></head>
<body>
<h2>Knack-style host page</h2>
<iframe id="trails" src="../index.html?embed"></iframe>
<iframe id="lifts" src="../lifts.html?embed"></iframe>
<iframe id="weather" src="../weather.html?embed"></iframe>
<iframe id="forecast" src="../forecast.html?embed"></iframe>
<iframe id="hourly" src="../hourly.html?embed"></iframe>
<iframe id="avalanche" src="../avalanche.html?embed"></iframe>
<iframe id="discussion" src="../discussion.html?embed"></iframe>
<iframe id="pass" src="../pass.html?embed"></iframe>
<iframe id="conditions" src="../conditions.html?embed"></iframe>
<p id="after">Content after the iframes</p>
</body></html>
