<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit at Snoqualmie Weather</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    body { padding: 15px; }

    #weatherStatus {
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 10px;
      max-width: 800px;
      margin: auto;
    }

    .weather-entry {
      padding: 12px;
      border-radius: 8px;
      background: #e3f2fd;
      box-shadow: 2px 2px 5px rgba(0, 0, 0, 0.1);
      font-size: 16px;
      text-align: left;
    }

    .weather-entry h3 { margin: 0 0 5px; font-size: 18px; }
    .weather-entry p { margin: 4px 0; }
    .label { font-weight: bold; }

    /* Resort closed: the feed keeps the last numbers it had, which can be months old. */
    .stale .weather-entry { opacity: 0.6; }
    .stale-note { grid-column: 1 / -1; margin: 0; font-style: italic; color: #555; }

    @media (max-width: 600px) {
      body { padding: 5px; }
      .weather-entry { padding: 8px; font-size: 14px; }
      .weather-entry h3 { font-size: 16px; }
    }
  </style>
</head>
<body>
  <div id="weatherStatus" class="panel">Loading weather data...</div>

  <script>
    const inches = (m) => (m?.inches != null ? `${m.inches} inches` : "N/A");

    function renderLocation(loc) {
      const surface = [loc.primarySurface, loc.secondarySurface].filter(Boolean).join(", ") || "N/A";
      return `<div class="weather-entry">
        <h3>${escapeHtml(loc.name)}</h3>
        <p><span class="label">Base Depth:</span> ${escapeHtml(inches(loc.base))}</p>
        <p><span class="label">Snow (Last 24h):</span> ${escapeHtml(inches(loc.snow24Hours))}</p>
        <p><span class="label">Surface:</span> ${escapeHtml(surface)}</p>
      </div>`;
    }

    startPage("weatherStatus", (el, data) => {
      const locations = toArray(data?.currentConditions?.resortLocations?.location);
      if (!locations.length) return showMessage(el, "Weather data unavailable.");

      const stale = !resortIsOpen(data);
      el.classList.toggle("stale", stale);
      el.innerHTML =
        (stale ? `<p class="stale-note">Last reported conditions. May be out of date while the resort is closed.</p>` : "") +
        locations.map(renderLocation).join("");
    });
  </script>
</body>
</html>
