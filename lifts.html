<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Central Lift Status</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    #liftStatus {
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      max-width: 95vw;
      margin: 0 auto;
    }

    .lift {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 10px;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      line-height: 1.1;
    }

    .lift-type {
      margin-left: 8px;
      font-size: 14px;
      font-weight: normal;
      color: #333;
      white-space: nowrap;
    }

    @media (max-width: 600px) {
      #liftStatus { grid-template-columns: 1fr; max-width: 90vw; }
      .lift { font-size: 16px; padding: 8px; min-height: 40px; }
    }
    @media (max-width: 400px) {
      .lift { font-size: 14px; padding: 6px; }
      .lift-type { display: none; }
    }
  </style>
</head>
<body>
  <div id="liftStatus" class="panel">Loading lift data...</div>

  <script>
    const AREA = "Summit Central";

    // "chairlift-4" -> "(4-seat)"
    const liftTypeLabel = (liftIcon) => {
      const m = String(liftIcon ?? "").match(/chairlift-(\d+)/i);
      return m ? `(${m[1]}-seat)` : "";
    };

    function renderLift(lift) {
      const type = liftTypeLabel(lift.liftIcon);
      return `<div class="lift ${statusClass(lift.status)}">
        ${escapeHtml(lift.name || "Unnamed Lift")}
        ${type ? `<span class="lift-type">${type}</span>` : ""}
      </div>`;
    }

    startPage("liftStatus", (el, data) => {
      const area = findArea(data, AREA);
      if (!area) throw new Error(`No "${AREA}" area in the feed.`);

      const lifts = toArray(area.lifts?.lift);
      if (!lifts.length) return showMessage(el, "No lift data available.");

      el.innerHTML = lifts.map(renderLift).join("");
    }, (data) => data?.liftsUpdated);
  </script>
</body>
</html>
