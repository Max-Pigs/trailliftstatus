<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Central Lift Status</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    #liftStatus { --cols: 4; --cols-portrait: 2; --embed-min-col: 160px; }

    .lift {
      flex-direction: column;
      justify-content: center;
      gap: 0.2em;
      text-align: center;
      font-size: 1.4rem;
    }
    .lift .meta { font-size: 0.65em; font-weight: normal; }
    html.embed .lift { font-size: 1.1rem; }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>Summit Central Lifts</h1>
    <div class="page-status"></div>
  </header>

  <div id="liftStatus" class="panel">Loading lift data...</div>

  <footer class="page-foot">
    <span></span>
    <span class="updated"></span>
  </footer>

  <script>
    const AREA = "Summit Central";

    // "chairlift-4" -> "4-seat chair", "magic-carpet" -> "Carpet"
    function liftTypeLabel(liftIcon) {
      const icon = String(liftIcon ?? "");
      const m = icon.match(/chairlift-(\d+)/i);
      if (m) return `${m[1]}-seat chair`;
      if (/carpet/i.test(icon)) return "Carpet";
      return "";
    }

    function renderLift(lift) {
      const meta = [lift.status || "Unknown", liftTypeLabel(lift.liftIcon)].filter(Boolean).join(" · ");
      return `<div class="tile lift ${statusClass(lift.status)}">
        <span class="name">${escapeHtml(lift.name || "Unnamed Lift")}</span>
        <span class="meta">${escapeHtml(meta)}</span>
      </div>`;
    }

    startPage("liftStatus", (el, data) => {
      const area = findArea(data, AREA);
      if (!area) throw new Error(`No "${AREA}" area in the feed.`);

      const lifts = toArray(area.lifts?.lift);
      if (!lifts.length) return showMessage(el, "No lift data available.");

      el.innerHTML = lifts.map(renderLift).join("");
      return `${lifts.filter(isOpen).length} of ${lifts.length} lifts open`;
    }, (data) => data?.liftsUpdated);
  </script>
</body>
</html>
