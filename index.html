<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Central trail status</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    #trailStatus { --cols: 5; --cols-portrait: 3; --embed-min-col: 180px; }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>Summit Central trails</h1>
    <div class="page-status"></div>
  </header>

  <div id="trailStatus" class="panel">Loading trail data...</div>

  <footer class="page-foot">
    <div class="legend"></div>
    <span class="updated"></span>
  </footer>

  <script>
    const AREA = "Summit Central";

    // The feed uses "novice" for green runs; our icon for that is Beginner.png.
    const DIFFICULTIES = [
      { keys: ["novice", "beginner"], icon: "Beginner.png", label: "Beginner" },
      { keys: ["intermediate"], icon: "Intermediate.png", label: "Intermediate" },
      { keys: ["advanced"], icon: "Advanced.png", label: "Advanced" },
      { keys: ["expert"], icon: "Expert.png", label: "Expert" },
    ];
    const difficultyOf = (trail) =>
      DIFFICULTIES.find((d) => d.keys.includes(String(trail.difficulty ?? "").toLowerCase()));

    const img = (src, alt) => `<img class="icon" src="${src}" alt="${escapeHtml(alt)}">`;

    function renderTrail(trail) {
      const d = difficultyOf(trail);
      return `<div class="tile trail ${statusClass(trail.status)}">
        ${d ? img(d.icon, d.label) : `<span class="icon"></span>`}
        <span class="name">${escapeHtml(trail.name)}</span>
        ${trail.groomed === true ? img("Groomed.png", "Groomed") : ""}
        ${statusMark(trail.status)}
      </div>`;
    }

    // Key for the difficulties on this board, plus groomed and the status marks.
    function renderLegend(trails) {
      const shown = DIFFICULTIES.filter((d) => trails.some((t) => difficultyOf(t) === d));
      document.querySelector(".legend").innerHTML =
        shown.map((d) => `<span>${img(d.icon, "")} ${d.label}</span>`).join("") +
        `<span>${img("Groomed.png", "")} Groomed</span>` +
        `<span>✓ Open</span><span>✕ Closed</span><span>‖ On hold</span>`;
    }

    startPage("trailStatus", (el, data) => {
      const area = findArea(data, AREA);
      if (!area) throw new Error(`No "${AREA}" area in the feed.`);

      const trails = toArray(area.trails?.trail).filter((t) => t?.name);
      if (!trails.length) return showMessage(el, "No trail data available.");

      // Beginner -> Expert (unknown difficulty last), then A-Z within each.
      const rank = (t) => {
        const r = DIFFICULTIES.indexOf(difficultyOf(t));
        return r === -1 ? DIFFICULTIES.length : r;
      };
      trails.sort((a, b) => rank(a) - rank(b) || a.name.localeCompare(b.name));

      el.innerHTML = trails.map(renderTrail).join("");
      renderLegend(trails);
      return `${trails.filter(isOpen).length} of ${trails.length} trails open`;
    }, (data) => data?.trailsUpdated);
  </script>
</body>
</html>
