<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summit Central Trail Status</title>
  <link rel="stylesheet" href="common.css">
  <script src="common.js"></script>
  <style>
    body { padding: 0; }

    #trailStatus {
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
      align-content: start;
      padding: 2vw;
      border-radius: 0;
    }

    /* Signage fills the screen; an embed sizes to its content. */
    html:not(.embed) #trailStatus { min-height: 100vh; }

    .trail {
      display: flex;
      align-items: center;
      gap: 0.4em;
      min-height: 55px;
      padding: 12px;
      border-radius: 8px;
      font-size: clamp(14px, 2vw, 24px);
      font-weight: bold;
      text-align: left;
    }

    .trail .name { flex: 1; }

    .icon {
      width: clamp(14px, 2vw, 24px);
      height: auto;
      flex: none;
    }

    @media (max-width: 480px) {
      #trailStatus { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }
    }
  </style>
</head>
<body>
  <div id="trailStatus" class="panel">Loading trail data...</div>

  <script>
    const AREA = "Summit Central";

    // The feed uses "novice" for green runs; our icon for that is Beginner.png.
    const DIFFICULTY_ICONS = {
      novice: "Beginner.png",
      beginner: "Beginner.png",
      intermediate: "Intermediate.png",
      advanced: "Advanced.png",
      expert: "Expert.png",
    };

    function renderTrail(trail) {
      const difficulty = String(trail.difficulty ?? "").toLowerCase();
      const icon = DIFFICULTY_ICONS[difficulty];
      const difficultyIcon = icon
        ? `<img class="icon" src="${icon}" alt="${escapeHtml(difficulty)}">`
        : `<span class="icon"></span>`;
      const groomedIcon = trail.groomed === true
        ? `<img class="icon" src="Groomed.png" alt="Groomed">`
        : "";

      return `<div class="trail ${statusClass(trail.status)}">
        ${difficultyIcon}
        <span class="name">${escapeHtml(trail.name)}</span>
        ${groomedIcon}
      </div>`;
    }

    startPage("trailStatus", (el, data) => {
      const area = findArea(data, AREA);
      if (!area) throw new Error(`No "${AREA}" area in the feed.`);

      const trails = toArray(area.trails?.trail).filter((t) => t?.name);
      if (!trails.length) return showMessage(el, "No trail data available.");

      el.innerHTML = trails.map(renderTrail).join("");
    });
  </script>
</body>
</html>
