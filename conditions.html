<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snoqualmie Pass Conditions</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="i90.css">
  <script src="common.js"></script>
  <script src="cameras.js"></script>
  <script src="i90.js"></script>
  <style>
    /* Landscape: report on the left, the two featured cams stacked on the right.
       Portrait: restrictions, then cams side by side, then the rest.
       Embed: one column. */
    html:not(.embed) #conditions {
      grid-template-columns: 3fr 2fr;
      grid-template-rows: auto auto auto 1fr;
      grid-template-areas: "restr cams" "road cams" "travel cams" "alerts cams";
    }
    @media (orientation: portrait) {
      html:not(.embed) #conditions {
        grid-template-columns: 1fr;
        /* Cams always get at least a quarter of the screen; text shrinks to fit instead. */
        grid-template-rows: auto minmax(25vh, 1fr) auto auto auto;
        grid-template-areas: "restr" "cams" "road" "travel" "alerts";
      }
      html:not(.embed) .featured { flex-direction: row; }
    }
    /* Embed: plain stacked column (named areas would otherwise add implicit columns). */
    html.embed #conditions { grid-template-columns: 1fr; }
    html.embed #conditions > * { grid-area: auto; }

    .restrictions { grid-area: restr; display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }
    .road-text { grid-area: road; }
    .travel { grid-area: travel; }
    .alerts { grid-area: alerts; min-height: 0; }
    .featured { grid-area: cams; display: flex; flex-direction: column; gap: 0.5rem; min-height: 0; }
    .featured .cam { flex: 1; }
    html.embed .featured { flex-direction: row; }

    .restriction { padding: 0.6em 0.8em; border-radius: 0.5rem; }
    .restriction .dir { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.85; }
    .restriction .text { margin: 0.2em 0 0; font-size: 1.15rem; font-weight: bold; line-height: 1.2; }

    .section { margin: 0; }
    .section h2 { margin: 0 0 0.3em; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: #555; }
    .road-text p { margin: 0 0 0.3em; font-size: 0.85rem; line-height: 1.3; }
    .road-text .temp { font-size: 1.3rem; font-weight: bold; }

    .travel ul, .alerts ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.35rem; }
    .travel li { display: flex; align-items: baseline; gap: 0.6em; padding: 0.3em 0.6em; border-radius: 0.4rem; font-size: 0.9rem; }
    .travel li:not(.on-hold):not(.closed) { background: #f1f3f5; }
    .travel .mins { margin-left: auto; font-size: 1.2em; font-weight: bold; white-space: nowrap; }
    .travel .normal { font-size: 0.8em; color: #555; white-space: nowrap; }

    .alerts li { padding: 0.35em 0.6em; border-left: 0.3em solid #adb5bd; background: #f8f9fa; border-radius: 0.3rem; font-size: 0.8rem; }
    .alerts li.high { border-left-color: #c62828; }
    .alerts li.medium { border-left-color: #f9a825; }
    .alerts .meta { font-weight: bold; }
    .alerts .headline {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .alerts .more, .alerts .none { font-size: 0.8rem; color: #555; }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>Snoqualmie Pass Conditions</h1>
    <div class="page-status"></div>
  </header>

  <div id="conditions" class="panel">Loading pass conditions...</div>

  <footer class="page-foot">
    <span>Road report, alerts, travel times and cameras: WSDOT</span>
    <span class="updated"></span>
  </footer>

  <script>
    const MAX_ALERTS = 5;

    async function fetchConditions() {
      const [catalog, pass] = await Promise.all([loadCameraCatalog(), fetchWsdot()]);
      if (!pass) throw new Error("WSDOT road report unavailable");
      return { pass, cams: camerasById(catalog, FEATURED_CAMERAS) };
    }

    function renderRestrictions(pass) {
      return `<div class="restrictions">
        ${[["Eastbound", pass.eastbound], ["Westbound", pass.westbound]].map(([dir, text]) => `
          <div class="restriction ${restrictionClass(text)}">
            <div class="dir">${dir}</div>
            <p class="text">${escapeHtml(text || "No report")}</p>
          </div>`).join("")}
      </div>`;
    }

    function renderRoadText(pass) {
      const rows = [
        pass.temperatureF != null ? `<p class="temp">${escapeHtml(pass.temperatureF)}°F at the pass</p>` : "",
        pass.roadCondition ? `<p><b>Road:</b> ${escapeHtml(pass.roadCondition)}</p>` : "",
        pass.weatherCondition ? `<p><b>Weather:</b> ${escapeHtml(pass.weatherCondition)}</p>` : "",
      ].join("");
      return rows ? `<div class="section road-text"><h2>WSDOT report</h2>${rows}</div>` : "";
    }

    // Colored when the drive is 10+ (yellow) or 30+ (red) minutes slower than normal.
    function renderTravel(times) {
      if (!times?.length) return "";
      return `<div class="section travel"><h2>Travel time</h2><ul>
        ${times.map((t) => {
          const late = (t.current ?? 0) - (t.average ?? 0);
          const cls = late >= 30 ? "closed" : late >= 10 ? "on-hold" : "";
          return `<li class="${cls}">
            <span>${escapeHtml(t.route ?? t.direction)}</span>
            <span class="mins">${escapeHtml(t.current)} min</span>
            <span class="normal">normal ${escapeHtml(t.average)}</span>
          </li>`;
        }).join("")}
      </ul></div>`;
    }

    function renderAlerts(alerts) {
      if (alerts == null) return "";  // worker without alerts, or the feed failed
      if (!alerts.length) return `<div class="section alerts"><h2>I-90 alerts</h2><p class="none">No active alerts between North Bend and Easton.</p></div>`;
      const mp = (a) => a.endMp && a.endMp !== a.startMp ? `MP ${a.startMp}–${a.endMp}` : a.startMp ? `MP ${a.startMp}` : "";
      const shown = alerts.slice(0, MAX_ALERTS);
      return `<div class="section alerts"><h2>I-90 alerts</h2><ul>
        ${shown.map((a) => `
          <li class="${escapeHtml(String(a.priority).toLowerCase())}">
            <div class="meta">${escapeHtml([a.category, a.direction, mp(a)].filter(Boolean).join(" · "))}</div>
            <div class="headline">${escapeHtml(a.headline)}</div>
          </li>`).join("")}
      </ul>${alerts.length > shown.length ? `<p class="more">+${alerts.length - shown.length} more on wsdot.com</p>` : ""}</div>`;
    }

    startPage("conditions", (el, { pass, cams }) => {
      el.innerHTML =
        renderRestrictions(pass) +
        renderRoadText(pass) +
        renderTravel(pass.travelTimes) +
        renderAlerts(pass.alerts) +
        (cams.length ? `<div class="featured">${cams.map((c) => renderCamTile(c)).join("")}</div>` : "");
      watchCamImages(el);
      return { statusHtml: "" };
    }, ({ pass }) => pass?.updated, fetchConditions);
  </script>
</body>
</html>
