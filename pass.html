<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-90 overview</title>
  <link rel="stylesheet" href="common.css">
  <link rel="stylesheet" href="i90.css">
  <script src="common.js"></script>
  <script src="cameras.js"></script>
  <script src="i90.js"></script>
  <style>
    /* The strip hugs its content; cam rows share the rest. */
    #pass { --cols: 5; --cols-portrait: 3; --embed-min-col: 220px; grid-template-rows: auto; }
    html.embed #pass { grid-template-rows: none; }

    /* Short chips only; full restriction text is on conditions.html. */
    .page-status .banner { font-size: 0.8rem; }

    .strip { grid-column: 1 / -1; }
    .strip svg { display: block; width: 100%; height: auto; }
    .strip text { font-family: var(--font-family-body); }
  </style>
</head>
<body>
  <header class="page-head">
    <h1>I-90 Snoqualmie Pass</h1>
    <div class="page-status"></div>
  </header>

  <div id="pass" class="panel">Loading pass cameras...</div>

  <footer class="page-foot">
    <span>Cameras and road report: WSDOT</span>
    <span class="updated"></span>
  </footer>

  <script>
    const SUMMIT_MP = 52;
    const SUMMIT_FT = 3022;

    async function fetchOverview() {
      const [catalog, pass] = await Promise.all([loadCameraCatalog(), fetchWsdot()]);
      return { catalog, cams: camerasById(catalog, SHOWN_CAMERAS), pass };
    }

    // Highway strip: I-90 west to east, segment bands, numbered cams with facing arrows, summit.
    function renderStrip(catalog, cams) {
      const W = 1000, H = 92, LINE_Y = 58, PAD = 40;
      const lo = Math.min(SUMMIT_MP, ...cams.map((c) => c.milepost)) - 1;
      const hi = Math.max(SUMMIT_MP, ...cams.map((c) => c.milepost)) + 1;
      const x = (mp) => PAD + ((mp - lo) / (hi - lo)) * (W - 2 * PAD);

      // Segment bands span the catalog cams of that segment within the strip's range.
      const inRange = catalog.filter((c) => c.milepost >= lo && c.milepost <= hi);
      const segments = [...new Set(inRange.map((c) => c.segment))].map((name) => {
        const mps = inRange.filter((c) => c.segment === name).map((c) => c.milepost);
        return { name, from: Math.min(...mps), to: Math.max(...mps) };
      });
      const bands = segments.map((s, i) => {
        const x1 = x(s.from) - 6, x2 = x(s.to) + 6;
        return `<rect x="${x1}" y="${LINE_Y - 22}" width="${Math.max(x2 - x1, 12)}" height="44" rx="6"
                  fill="${i % 2 ? "var(--color-base-neutral-50)" : "var(--color-surface-subtle)"}"/>
                <text x="${(x1 + x2) / 2}" y="${LINE_Y - 28}" font-size="12" fill="var(--color-text-secondary)" text-anchor="middle">${escapeHtml(s.name)}</text>`;
      }).join("");

      const summit = `
        <path d="M${x(SUMMIT_MP) - 9},${LINE_Y + 20} L${x(SUMMIT_MP)},${LINE_Y + 6} L${x(SUMMIT_MP) + 9},${LINE_Y + 20} Z" fill="var(--color-text-brand)"/>
        <text x="${x(SUMMIT_MP)}" y="${LINE_Y + 33}" font-size="11" fill="var(--color-text-brand)" text-anchor="middle">Summit ${SUMMIT_FT.toLocaleString()} ft</text>`;

      // A small wedge above each pin points the way the cam looks.
      const wedge = (cx, dir) => {
        const s = dir === "E" ? 1 : -1;  // point right for east, left for west
        return `<path d="M${cx + s},${LINE_Y - 27} L${cx + 17 * s},${LINE_Y - 19} L${cx + s},${LINE_Y - 11} Z"
                  fill="var(--color-safety-caution)" stroke="var(--color-base-brand-black)" stroke-width="1"/>`;
      };
      const pins = cams.map((c, i) => {
        const cx = x(c.milepost), dir = String(CAMERA_FACING[c.id] ?? "").toUpperCase();
        const arrows = dir === "E" || dir === "W" ? wedge(cx, dir)
          : dir === "BOTH" ? wedge(cx, "E") + wedge(cx, "W") : "";
        return `${arrows}
          <circle cx="${cx}" cy="${LINE_Y}" r="9" fill="var(--color-action-primary)" stroke="#fff" stroke-width="2"/>
          <text x="${cx}" y="${LINE_Y + 4}" font-size="11" font-weight="bold" fill="#fff" text-anchor="middle">${i + 1}</text>`;
      }).join("");

      return `<div class="strip">
        <svg viewBox="0 0 ${W} ${H}" role="img" aria-label="I-90 from milepost ${Math.round(lo)} to ${Math.round(hi)} with camera locations">
          <text x="4" y="${LINE_Y + 4}" font-size="12" fill="var(--color-text-secondary)">W</text>
          <text x="${W - 4}" y="${LINE_Y + 4}" font-size="12" fill="var(--color-text-secondary)" text-anchor="end">E</text>
          ${bands}
          <line x1="${PAD - 10}" y1="${LINE_Y}" x2="${W - PAD + 10}" y2="${LINE_Y}" stroke="var(--color-base-brand-red)" stroke-width="5" stroke-linecap="round"/>
          ${summit}
          ${pins}
        </svg>
      </div>`;
    }

    function renderRestrictionChips(pass) {
      if (!pass) return `<span class="banner unknown">Road report unavailable</span>`;
      return [["EB", pass.eastbound], ["WB", pass.westbound]]
        .map(([dir, text]) => `<span class="banner ${restrictionClass(text)}">${dir}: ${escapeHtml(restrictionShort(text))}</span>`)
        .join("");
    }

    // Signage: pick the column count that makes the camera images largest for this
    // screen and number of cams (WSDOT images are about 320x201).
    const CAM_ASPECT = 320 / 201;
    function layoutCams() {
      const panel = document.getElementById("pass");
      const tiles = panel.querySelectorAll(".cam");
      if (EMBED || !tiles.length) return;
      const gap = parseFloat(getComputedStyle(panel).rowGap) || 0;
      const fixed = [...panel.children].filter((c) => !c.classList.contains("cam"))
        .reduce((h, c) => h + c.offsetHeight + gap, 0);
      const labelH = tiles[0].querySelector(".label").offsetHeight + 12;
      const W = panel.clientWidth - 20, H = panel.clientHeight - fixed - 20;

      let best = 1, bestWidth = 0;
      for (let cols = 1; cols <= tiles.length; cols++) {
        const rows = Math.ceil(tiles.length / cols);
        const cellW = (W - gap * (cols - 1)) / cols;
        const cellH = (H - gap * (rows - 1)) / rows - labelH;
        const imgW = Math.min(cellW, cellH * CAM_ASPECT);
        if (imgW > bestWidth) { best = cols; bestWidth = imgW; }
      }
      panel.style.setProperty("--cols", best);
      panel.style.setProperty("--cols-portrait", best);
    }
    window.addEventListener("resize", () => { layoutCams(); fitToScreen(); });

    startPage("pass", (el, { catalog, cams, pass }) => {
      if (!cams.length) return showMessage(el, "No cameras selected. See cameras.js.");
      el.innerHTML = renderStrip(catalog, cams) + cams.map((c, i) => renderCamTile(c, i + 1)).join("");
      layoutCams();
      watchCamImages(el);
      return { statusHtml: renderRestrictionChips(pass) };
    }, ({ pass }) => pass?.updated, fetchOverview);
  </script>
</body>
</html>
